<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavo AI 视频复刻控制台 (审查模式)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen py-10 px-4">
  <div class="max-w-5xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-3xl font-extrabold text-blue-400">Pavo 视频复刻与换脸生成平台</h1>
      <p class="text-gray-400 mt-2">严格执行 9:16 规格、10 秒分镜与人物声音强绑定</p>
    </header>

    <!-- 第一步：上传与分析 -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
      <h2 class="text-xl font-bold mb-4 flex items-center text-gray-200">
        <span class="bg-blue-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">1</span>
        上传爆款视频
      </h2>
      <div class="flex flex-col sm:flex-row gap-4 items-center">
        <input type="file" id="videoFile" accept="video/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer border border-gray-600 rounded-lg">
        <button id="analyzeBtn" onclick="uploadAndAnalyze()" class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold transition whitespace-nowrap">
          解析并自动换脸
        </button>
      </div>
      <div id="loadingStatus" class="hidden mt-4 text-sm text-yellow-400 animate-pulse">
        ⏳ 正在抽帧 9:16、听写台词、匹配华人模特换脸中，请稍候约 10-30 秒...
      </div>
    </div>

    <!-- 第二步：人工审查与修改区域 -->
    <div id="reviewSection" class="hidden space-y-6">
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex justify-between items-center flex-wrap gap-2">
        <h2 class="text-xl font-bold flex items-center text-gray-200">
          <span class="bg-green-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">2</span>
          核对关键帧与提示词
        </h2>
        <div id="metaBadge" class="text-sm px-3 py-1 bg-gray-700 rounded-full text-green-300 font-mono"></div>
      </div>

      <!-- 分镜卡片展示区 -->
      <div id="cardsContainer" class="space-y-6"></div>

      <!-- 确认提交区域 -->
      <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Pavo Auth Token</label>
          <input type="password" id="pavoToken" placeholder="请输入你的 Pavo Auth Token" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-blue-500 focus:outline-none">
        </div>
        <button id="submitBtn" onclick="submitFinalGeneration()" class="w-full py-3 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-lg text-white transition shadow-lg">
          ✅ 确认无误，下一步生成视频
        </button>
        <div id="submitStatus" class="hidden text-sm text-center text-green-400 font-semibold"></div>
      </div>
    </div>
  </div>

  <script>
    let currentSegments = [];

    async function uploadAndAnalyze() {
      const fileInput = document.getElementById("videoFile");
      if (!fileInput.files[0]) {
        alert("请先选择视频文件！");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      document.getElementById("loadingStatus").classList.remove("hidden");
      document.getElementById("analyzeBtn").disabled = true;

      try {
        const res = await fetch("/api/analyze", { method: "POST", body: formData });
        const data = await res.json();

        currentSegments = data.segments;
        document.getElementById("metaBadge").innerText = `已匹配底模: ${data.model_used} | ${data.gender === 'female' ? '女性' : '男性'} | ${data.age} 岁`;

        const container = document.getElementById("cardsContainer");
        container.innerHTML = "";

        data.segments.forEach((seg, idx) => {
          const card = document.createElement("div");
          card.className = "bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col md:flex-row gap-6 items-start";
          card.innerHTML = `
            <div class="flex-shrink-0 w-full md:w-52 text-center">
              <span class="inline-block mb-2 text-xs font-bold text-blue-400 uppercase tracking-wider">分镜 ${seg.segment_index} (10s)</span>
              <img src="${seg.image_url}" class="w-full h-auto aspect-[9/16] object-cover rounded-lg border border-gray-600 shadow" alt="换脸后首帧">
            </div>
            <div class="flex-1 w-full space-y-2">
              <label class="block text-sm font-semibold text-gray-300">生成的结构化提示词 (可直接在线编辑)：</label>
              <textarea id="prompt_${idx}" rows="14" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-xs font-mono text-gray-200 focus:border-blue-500 focus:outline-none">${seg.prompt}</textarea>
            </div>
          `;
          container.appendChild(card);
        });

        document.getElementById("reviewSection").classList.remove("hidden");
      } catch (err) {
        alert("分析视频失败，请检查控制台或终端日志！");
      } finally {
        document.getElementById("loadingStatus").classList.add("hidden");
        document.getElementById("analyzeBtn").disabled = false;
      }
    }

    async function submitFinalGeneration() {
      const token = document.getElementById("pavoToken").value.trim();
      if (!token) {
        alert("请先填写 Pavo Auth Token！");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      const submitStatus = document.getElementById("submitStatus");
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 正在下发生成任务到 Pavo AI...";

      const payloadSegments = currentSegments.map((seg, idx) => {
        return {
          segment_index: seg.segment_index,
          image_url: seg.image_url,
          prompt: document.getElementById(`prompt_${idx}`).value
        };
      });

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, segments: payloadSegments })
        });
        const result = await res.json();

        submitStatus.innerText = result.message || "任务已成功提交！";
        submitStatus.classList.remove("hidden");
        alert(result.message || "任务已提交！");
      } catch (err) {
        alert("提交生成失败，请检查网络或后端接口！");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ 确认无误，下一步生成视频";
      }
    }
  </script>
</body>
</html>
